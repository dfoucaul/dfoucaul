<svg xmlns="http://www.w3.org/2000/svg" width="960" height="260" viewBox="0 0 960 260" role="img" aria-labelledby="title desc">
  <title id="title">Co-founder at Shredeo and Prometheus Vision</title>
  <desc id="desc">Shredeo: one platform for gyms and studios, from memberships and coaching to payments and branded apps. Prometheus Vision: software, AI and data, from business intelligence to custom apps and automation. Official monochrome logos.</desc>
  <style>
    @keyframes prometheus-unfold {
      from { transform:scale(0) }
      to { transform:scale(1) }
    }
    @keyframes prometheus-turn {
      from { transform:rotate(0deg) }
      to { transform:rotate(360deg) }
    }
    .prometheus-expand {
      transform-origin:0 0;
      animation:prometheus-unfold .95s cubic-bezier(.22,1,.36,1) both;
    }
    .prometheus-orbit {
      transform-origin:0 0;
      animation:prometheus-turn 24s steps(720, end) .95s infinite;
    }
    @media(prefers-reduced-motion:reduce) {
      .prometheus-expand,.prometheus-orbit { animation:none;transform:none }
    }
  </style>
  <image width="960" height="260" href="data:image/svg+xml;base64," aria-hidden="true" /><svg viewBox="82 75 341 387" fill="#e6edf3" role="img" aria-label="Prometheus Vision" overflow="visible" x="544" y="84" width="38" height="44"><g transform="translate(256 268)"><g class="prometheus-orbit"><g class="prometheus-expand"><circle cx="0" cy="-163" r="30" /><circle cx="0" cy="164" r="30" /><circle cx="-144" cy="-85" r="30" /><circle cx="-144" cy="79" r="30" /><circle cx="137" cy="-85" r="30" /><circle cx="137" cy="79" r="30" /></g></g></g><circle cx="256" cy="268" r="30" /></svg>
          </svg>
